name: Deploy Knight Rush to Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Validate canonical game source
        run: node tools/validate-html.cjs KnightRush.html

      - name: Validate fast runtime and closure contracts
        run: node tools/validate-runtime.cjs KnightRush.html --quick

      - name: Build single-file Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          cp KnightRush.html _site/index.html
          cmp --silent KnightRush.html _site/index.html
          test "$(find _site -type f | wc -l)" -eq 1

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
